<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>claude-conductor — Live Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141413;
      --bg-card: #1e1e1d;
      --bg-card-hover: #242423;
      --bg-card-header: #222221;
      --border: #2a2a28;
      --text: #faf9f5;
      --text-dim: #b0aea5;
      --text-muted: #8a8880;
      --accent: #d4a843;
      --accent-dim: rgba(212, 168, 67, 0.15);
      --success: #4ade80;
      --success-dim: rgba(74, 222, 128, 0.12);
      --teal: #7ab5b0;
      --red: #c45c4e;
      --red-dim: rgba(196, 92, 78, 0.15);
      --blue: #4dabf7;
      --bar-bg: #2a2a28;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    #root { max-width: 1400px; margin: 0 auto; padding: 0; }

    /* --- Header --- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      background: var(--bg-card-header);
      border-bottom: 2px solid var(--accent);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-title .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes pulse-amber {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
      50% { opacity: 0.4; box-shadow: 0 0 2px var(--accent); }
    }
    .header-stats {
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .stat-label { color: var(--text-muted); margin-right: 6px; }
    .stat-value { color: var(--text); font-weight: 500; }
    .stat-value.cost { color: var(--accent); }

    /* --- Grid --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 16px;
      padding: 0 32px 32px;
    }

    /* --- Session Card --- */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card.status-thinking  { border-left: 3px solid var(--success); }
    .card.status-waiting   { border-left: 3px solid var(--accent); }
    .card.status-error     { border-left: 3px solid var(--red); }
    .card.status-idle      { border-left: 3px solid var(--text-muted); opacity: 0.7; }
    .card.status-idle-stale { border-left: 3px solid var(--border); opacity: 0.35; }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 0;
    }

    /* Persona slot */
    .persona-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-width: 54px;
    }
    .persona-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--border);
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      overflow: hidden;
    }
    .persona-avatar.linked { border-color: var(--accent); }
    .persona-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .persona-name {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'JetBrains Mono', monospace;
    }
    .persona-name.linked { color: var(--accent); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex: 1;
      min-width: 0;
    }
    .card-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.thinking { background: var(--success); animation: pulse 1.5s infinite; }
    .status-dot.waiting  { background: var(--accent); animation: pulse-amber 2s infinite; }
    .status-dot.error    { background: var(--red); }
    .status-dot.idle     { background: var(--text-muted); }
    .status-dot.idle-stale { background: var(--border); }

    .card-status {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .card-status.thinking { color: var(--success); background: var(--success-dim); }
    .card-status.waiting  { color: var(--accent); background: var(--accent-dim); }
    .card-status.error    { color: var(--red); background: var(--red-dim); }
    .card-status.idle     { color: var(--text-muted); background: rgba(138,136,128,0.1); }
    .card-status.idle-stale { color: var(--border); background: rgba(42,42,40,0.3); }

    .conductor-status {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    .perm-badge {
      font-size: 0.6rem;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-family: 'JetBrains Mono', monospace;
    }
    .perm-badge.bypass { color: var(--red); background: var(--red-dim); }
    .perm-badge.accept-edits { color: var(--accent); background: var(--accent-dim); }
    .perm-badge.plan { color: var(--teal); background: rgba(122, 181, 176, 0.12); }
    .perm-badge.default { color: var(--text-muted); background: rgba(138, 136, 128, 0.1); }

    /* Subagents */
    .subagents {
      margin-bottom: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .subagents-header {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .subagent {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      padding: 3px 0;
      font-family: 'JetBrains Mono', monospace;
    }
    .subagent-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .subagent-dot.thinking { background: var(--success); animation: pulse 1.5s infinite; }
    .subagent-dot.idle { background: var(--text-muted); }
    .subagent-task {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .subagent-tokens {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .card-body { padding: 12px 16px 16px; }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .meta-item {
      display: flex;
      justify-content: space-between;
    }
    .meta-key { color: var(--text-muted); }
    .meta-val { color: var(--text-dim); font-weight: 500; }
    .meta-val.cost { color: var(--accent); }

    /* Context bar */
    .context-bar-container {
      margin-bottom: 12px;
    }
    .context-bar-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
    }
    .context-bar {
      height: 4px;
      background: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }
    .context-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* Active files */
    .active-files {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .file-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      background: var(--bar-bg);
      border-radius: 3px;
      color: var(--teal);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Git branch */
    .git-branch {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Recent log */
    .log-toggle {
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: none;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 0;
    }
    .log-toggle:hover { color: var(--text-dim); }
    .log-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .log-feed {
      margin-top: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.7rem;
      line-height: 1.6;
      font-family: 'JetBrains Mono', monospace;
    }
    .log-entry {
      display: flex;
      gap: 8px;
      color: var(--text-muted);
    }
    .log-time { color: var(--text-muted); flex-shrink: 0; min-width: 55px; }
    .log-type { flex-shrink: 0; min-width: 40px; font-weight: 500; }
    .log-type.tool  { color: var(--teal); }
    .log-type.think { color: var(--success); }
    .log-type.user  { color: var(--accent); }
    .log-type.error { color: var(--red); }
    .log-msg {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-dim);
    }

    /* Conductor task bar */
    .conductor-task {
      font-size: 0.72rem;
      color: var(--text-dim);
      padding: 6px 16px;
      background: var(--bg-card-header);
      border-top: 1px solid var(--border);
      line-height: 1.4;
    }
    .conductor-task .task-label {
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .conductor-files {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    /* Merge order section */
    .merge-order {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 0 32px 24px;
    }
    .merge-order-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      font-family: 'Poppins', sans-serif;
    }
    .merge-order-text {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      white-space: pre-wrap;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty h2 {
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-dim);
      font-family: 'Poppins', sans-serif;
    }
    .empty p {
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-card); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Vendored (React 18 UMD) so the dashboard works offline; fonts degrade to system stacks. -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script>
    const { useState, useEffect, useCallback } = React;
    const e = React.createElement;

    // --- Status emoji map (conductor conventions) ---
    const STATUS_EMOJI = {
      thinking: '\u26A1',
      waiting: '\uD83D\uDD34',
      error: '\u274C',
      idle: '\u23F8\uFE0F',
      'idle-stale': '\uD83D\uDC7B'
    };

    function formatNumber(n) {
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
      if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
      return String(n);
    }

    function formatCost(c) {
      if (c === null || c === undefined) return '\u2014';
      return '$' + c.toFixed(4);
    }

    function timeAgo(iso) {
      if (!iso) return '-';
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 5) return 'just now';
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      if (s < 86400) return Math.floor(s / 3600) + 'h ago';
      return Math.floor(s / 86400) + 'd ago';
    }

    function formatTime(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    function contextPercent(lastTurnInputTotal, contextWindow) {
      return Math.min(100, (lastTurnInputTotal / (contextWindow || 200_000)) * 100);
    }

    function contextBarColor(pct) {
      if (pct > 80) return 'var(--red)';
      if (pct > 50) return 'var(--accent)';
      return 'var(--teal)';
    }

    // --- Persona helpers ---
    const PERSONA_ICON_BASE = 'https://raw.githubusercontent.com/code-katz/.github/main/media/logos';
    // Fallback roster; the live list comes from /api/health (server-side
    // discovery of installed claude-team profiles).
    let KNOWN_PERSONAS = new Set([
      'akira', 'alex', 'casey', 'jordan', 'kai', 'morgan', 'quinn', 'river', 'robin', 'sage', 'sasha', 'toni'
    ]);

    function personaIconUrl(name) {
      if (!name) return null;
      const lower = name.toLowerCase();
      return KNOWN_PERSONAS.has(lower) ? PERSONA_ICON_BASE + '/' + lower + '-icon.png' : null;
    }

    function personaInitial(label) {
      if (!label) return '?';
      const name = label.split('/').pop().split('-')[0];
      return name.charAt(0).toUpperCase();
    }

    function SessionCard({ session }) {
      const [expanded, setExpanded] = useState(false);
      const st = session.status;
      const pct = contextPercent(session.lastTurnInputTotal || session.tokensIn, session.contextWindow);
      const emoji = STATUS_EMOJI[st] || '';
      const c = session.conductor;
      const isLinked = !!(c && c.persona);
      const personaDisplay = isLinked ? c.persona.charAt(0).toUpperCase() + c.persona.slice(1) : 'Unassigned';
      const conductorStatusDisplay = session.conductorStatus || st;

      return e('div', { className: 'card status-' + st },
        // Top row: persona slot + header
        e('div', { className: 'card-top' },
          // Persona slot
          e('div', { className: 'persona-slot' },
            e('div', { className: 'persona-avatar' + (isLinked ? ' linked' : '') },
              isLinked && personaIconUrl(c.persona)
                ? e('img', { src: personaIconUrl(c.persona), alt: c.persona })
                : (isLinked ? c.persona.charAt(0).toUpperCase() : personaInitial(session.label))
            ),
            e('span', { className: 'persona-name' + (isLinked ? ' linked' : '') }, personaDisplay)
          ),

          // Header content
          e('div', { className: 'card-header' },
            e('div', null,
              e('div', { className: 'card-label',
                style: session.cwd ? { cursor: 'pointer' } : {},
                onClick: session.cwd ? (ev) => {
                  fetch('/api/open-folder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: session.cwd })
                  }).then(r => {
                    if (!r.ok) {
                      const el = ev.currentTarget;
                      el.style.textDecoration = 'line-through';
                      el.title = 'Folder not found: ' + session.cwd;
                    }
                  });
                } : undefined,
                title: session.cwd || ''
              },
                e('span', { className: 'status-dot ' + st }),
                session.label || session.sessionId.substring(0, 8)
              ),
              session.gitBranch ? e('div', { className: 'git-branch' }, session.gitBranch) : null
            ),
            e('div', { style: { display: 'flex', gap: '6px', alignItems: 'center', flexShrink: 0 } },
              session.permissionMode === 'bypassPermissions'
                ? e('span', { className: 'perm-badge bypass' }, 'YOLO')
                : session.permissionMode === 'dontAsk'
                ? e('span', { className: 'perm-badge bypass' }, 'DONT-ASK')
                : session.permissionMode === 'acceptEdits'
                ? e('span', { className: 'perm-badge accept-edits' }, 'AUTO-EDIT')
                : session.permissionMode === 'auto'
                ? e('span', { className: 'perm-badge accept-edits' }, 'AUTO')
                : session.permissionMode === 'plan'
                ? e('span', { className: 'perm-badge plan' }, 'PLAN')
                : e('span', { className: 'perm-badge default' }, 'ASK'),
              e('span', { className: 'card-status ' + st }, emoji + ' ' + conductorStatusDisplay)
            )
          )
        ),

        // Conductor task bar (only for linked sessions)
        isLinked && c.task
          ? e('div', { className: 'conductor-task' },
              e('span', { className: 'task-label' }, 'Task: '),
              c.task,
              c.files ? e('div', { className: 'conductor-files' }, 'Files: ' + c.files) : null,
              c.branch ? e('div', { className: 'conductor-files' }, 'Branch: ' + c.branch) : null
            )
          : null,

        // Card body
        e('div', { className: 'card-body' },
          // Meta grid
          e('div', { className: 'card-meta' },
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Model'),
              e('span', { className: 'meta-val' }, session.model || '-')
            ),
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Cost'),
              e('span', { className: 'meta-val cost', title: session.costSource === 'unknown' ? 'Unknown model \u2014 no rate in pricing.json' : 'Cost source: ' + (session.costSource || 'pricing') }, formatCost(session.costUSD))
            ),
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Output'),
              e('span', { className: 'meta-val' }, formatNumber(session.tokensOut))
            ),
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Cache Read'),
              e('span', { className: 'meta-val' }, formatNumber(session.cacheReadIn || 0))
            ),
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Turns'),
              e('span', { className: 'meta-val' }, session.turnCount)
            ),
            e('div', { className: 'meta-item' },
              e('span', { className: 'meta-key' }, 'Last Event'),
              e('span', { className: 'meta-val' }, timeAgo(session.lastEventAt))
            )
          ),

          // Context bar
          e('div', { className: 'context-bar-container' },
            e('div', { className: 'context-bar-label' },
              e('span', null, 'Context Window'),
              e('span', null, pct.toFixed(0) + '%')
            ),
            e('div', { className: 'context-bar' },
              e('div', { className: 'context-bar-fill', style: {
                width: pct + '%',
                background: contextBarColor(pct)
              }})
            )
          ),

          // Active files
          session.activeFiles.length > 0
            ? e('div', { className: 'active-files' },
                session.activeFiles.map((f, i) => e('span', { key: i, className: 'file-tag' }, f))
              )
            : null,

          // Subagents
          session.subagents && session.subagents.length > 0
            ? e('div', { className: 'subagents' },
                e('div', { className: 'subagents-header' }, 'Subagents (' + session.subagents.length + ')'),
                session.subagents.map((sub, i) =>
                  e('div', { key: i, className: 'subagent' },
                    e('span', { className: 'subagent-dot ' + sub.status }),
                    e('span', { className: 'subagent-task' }, sub.task || sub.agentId),
                    e('span', { className: 'subagent-tokens' }, formatNumber(sub.tokensOut) + ' out')
                  )
                )
              )
            : null,

          // Log toggle + feed
          e('button', {
            className: 'log-toggle',
            'aria-expanded': expanded,
            onClick: () => setExpanded(!expanded)
          }, expanded ? '- Hide log' : '+ Show log (' + session.recentLog.length + ')'),

          expanded ? e('div', { className: 'log-feed', role: 'log' },
            session.recentLog.slice().reverse().map((entry, i) =>
              e('div', { key: i, className: 'log-entry' },
                e('span', { className: 'log-time' }, formatTime(entry.time)),
                e('span', { className: 'log-type ' + entry.type }, entry.type),
                e('span', { className: 'log-msg' }, entry.msg)
              )
            )
          ) : null
        )
      );
    }

    function Dashboard() {
      const [sessions, setSessions] = useState([]);
      const [conductor, setConductor] = useState(null);
      const [health, setHealth] = useState(null);
      const [lastFetch, setLastFetch] = useState(null);

      const fetchAll = useCallback(() => {
        fetch('/api/sessions')
          .then(r => r.json())
          .then(data => {
            setSessions(data);
            setLastFetch(new Date());
          })
          .catch(() => {});
        fetch('/api/conductor')
          .then(r => r.json())
          .then(data => setConductor(data))
          .catch(() => {});
        fetch('/api/health')
          .then(r => r.json())
          .then(data => {
            setHealth(data);
            if (Array.isArray(data.personas) && data.personas.length) {
              KNOWN_PERSONAS = new Set(data.personas);
            }
          })
          .catch(() => {});
      }, []);

      useEffect(() => {
        fetchAll();
        const iv = setInterval(fetchAll, 2000);
        return () => clearInterval(iv);
      }, [fetchAll]);

      const totalCost = sessions.reduce((s, x) => s + (x.costUSD || 0), 0);
      const totalOut = sessions.reduce((s, x) => s + x.tokensOut, 0);
      const activeSessions = sessions.filter(s => s.status === 'thinking' || s.status === 'waiting').length;

      return e('div', null,
        // Transcript format drift warning
        health && health.formatDrift
          ? e('div', { style: { background: 'var(--red, #b91c1c)', color: '#fff', padding: '6px 14px', fontSize: '12px', borderRadius: '6px', margin: '8px 0' } },
              '\u26a0 ' + health.parseErrors + ' of ' + health.parsedLines + ' transcript lines failed to parse \u2014 the Claude Code session format may have changed. Token/cost data may be incomplete.')
          : null,
        // Header
        e('div', { className: 'header' },
          e('div', { className: 'header-left' },
            e('div', { className: 'header-title' },
              e('span', { className: 'dot' }),
              'claude-conductor'
            )
          ),
          e('div', { className: 'header-stats' },
            e('span', null,
              e('span', { className: 'stat-label' }, 'Sessions'),
              e('span', { className: 'stat-value' }, activeSessions + '/' + sessions.length)
            ),
            e('span', null,
              e('span', { className: 'stat-label' }, 'Output'),
              e('span', { className: 'stat-value' }, formatNumber(totalOut))
            ),
            e('span', null,
              e('span', { className: 'stat-label' }, 'Cost'),
              e('span', { className: 'stat-value cost' }, formatCost(totalCost))
            )
          )
        ),

        // Cards
        sessions.length === 0
          ? e('div', { className: 'empty' },
              e('h2', null, 'No sessions detected'),
              e('p', null, 'Start a Claude Code session to see it here.')
            )
          : e('div', { className: 'grid' },
              sessions.map(s => e(SessionCard, { key: s.sessionId, session: s }))
            ),

        // Merge order (from SESSIONS.md)
        conductor && conductor.mergeOrder && conductor.mergeOrder !== 'No dependencies defined.'
          ? e('div', { className: 'merge-order' },
              e('div', { className: 'merge-order-title' }, 'Merge Order'),
              e('div', { className: 'merge-order-text' }, conductor.mergeOrder)
            )
          : null
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(Dashboard));
  </script>
</body>
</html>
